name: 'Set up MoonBit'
description: >-
  Install the pinned MoonBit toolchain and core, and export NEW_MOON_MOD=0 for
  every downstream step. NEW_MOON_MOD=0 opts out of the rr_moon_mod
  TOML migration (moonbitlang/moon#1716), which otherwise drops path
  fields from cross-repo deps that have no valid TOML expression.
  Setup chosen after comparing three candidates on 2026-05-23 (run
  26330483536); see docs/2026-05-22-upstream-moonbit-rr-moon-mod-issue.md.

runs:
  using: composite
  steps:
    - name: Export NEW_MOON_MOD opt-out
      shell: bash
      run: echo "NEW_MOON_MOD=0" >> "$GITHUB_ENV"
    - name: Read MoonBit toolchain manifest
      id: moonbit-toolchain
      shell: bash
      run: "$GITHUB_WORKSPACE/scripts/moon-toolchain.sh github-output >> \"$GITHUB_OUTPUT\""
    # MoonBit toolchain and core are pinned as a compatibility pair. The core
    # CDN publishes matching versioned archives (unlike older releases).
    - name: Install MoonBit
      uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f
      with:
        version: ${{ steps.moonbit-toolchain.outputs.compiler }}
        core-version: ${{ steps.moonbit-toolchain.outputs.core }}
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Verify MoonBit core bundle
      shell: bash
      run: |
        for target in wasm wasm-gc js native; do
          test -f "$HOME/.moon/lib/core/_build/$target/release/bundle/prelude/prelude.mi"
        done

    - name: Cache MoonBit registry state
      id: moonbit-registry-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          ~/.moon/registry/index
          ~/.moon/registry/cache
          ~/.moon/registry/symbols
        key: moonbit-registry-v2-${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('.moonbit-toolchain') }}-${{ hashFiles('moon.work', '**/moon.mod', '**/moon.mod.json') }}
        restore-keys: |
          moonbit-registry-v2-${{ runner.os }}-${{ runner.arch }}-toolchain-${{ hashFiles('.moonbit-toolchain') }}-

    - name: Bootstrap MoonBit registry
      if: steps.moonbit-registry-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: "$GITHUB_WORKSPACE/scripts/moon-update.sh"
