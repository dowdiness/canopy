  loomark-standalone-e2e:
    name: Loomark Standalone E2E
    needs: [changes]
    if: needs.changes.outputs.run_loomark_standalone_e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native build toolchain
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential
          rm -rf /var/lib/apt/lists/*

      - name: Trust container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Verify MoonBit installation
        run: moon version --all

      - name: Run Loomark standalone browser suite
        run: ./scripts/test-loomark-standalone-e2e.sh

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - dep-check
      - changes
      - test-main
      - test-submodules
      - test-examples
      - prove
      - quint-sync-verification
      - format-check
      - build-js
      - web-build
      - waku-build
      - waku-e2e
      - waku-workerd
      - tooling-validation
      - release-version-validation
      - ideal-web-e2e
      - demo-react-e2e
      - canvas-e2e
      - cm6-adapter-e2e
      - loomark-standalone-e2e
    if: always()
    steps:
      - name: Check all job statuses
        run: |
          ok() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          path_filtered_ok() {
            [[ "$1" == "success" ]] ||
              [[ "$1" == "skipped" && "$2" == "false" ]]
          }
          if ! ok "${{ needs.dep-check.result }}" || \
             ! ok "${{ needs.changes.result }}" || \
             ! ok "${{ needs.test-main.result }}" || \
             ! ok "${{ needs.test-submodules.result }}" || \
             ! ok "${{ needs.test-examples.result }}" || \
             ! ok "${{ needs.prove.result }}" || \
             ! path_filtered_ok \
               "${{ needs.quint-sync-verification.result }}" \
               "${{ needs.changes.outputs.run_quint_sync }}" || \
             ! ok "${{ needs.format-check.result }}" || \
             ! ok "${{ needs.build-js.result }}" || \
             ! ok "${{ needs.web-build.result }}" || \
             ! ok "${{ needs.waku-build.result }}" || \
             ! ok "${{ needs.waku-e2e.result }}" || \
             ! ok "${{ needs.waku-workerd.result }}" || \
             ! path_filtered_ok \
               "${{ needs.tooling-validation.result }}" \
               "${{ needs.changes.outputs.run_tooling_validation }}" || \
             ! path_filtered_ok \
               "${{ needs.release-version-validation.result }}" \
               "${{ needs.changes.outputs.run_release_version_validation }}" || \
             ! ok "${{ needs.ideal-web-e2e.result }}" || \
             ! ok "${{ needs.demo-react-e2e.result }}" || \
             ! path_filtered_ok \
               "${{ needs.canvas-e2e.result }}" \
               "${{ needs.changes.outputs.run_canvas_e2e }}" || \
             ! ok "${{ needs.cm6-adapter-e2e.result }}" || \
             ! path_filtered_ok \
               "${{ needs.loomark-standalone-e2e.result }}" \
               "${{ needs.changes.outputs.run_loomark_standalone_e2e }}"; then
            echo "❌ One or more required checks failed"
            exit 1
          fi
          echo "✅ All checks passed!"
