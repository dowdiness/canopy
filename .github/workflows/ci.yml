name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dep-check:
    name: Dependency Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Nushell
        uses: hustcer/setup-nu@f3fd65374ffc4d60974c0dd2f7263c6c5c285f81
        with:
          version: "0.114.1"

      - name: Run check-deps
        run: ./scripts/check-deps.sh

      - name: Check shared-substrate version drift
        run: ./scripts/check-shared-substrate.sh

      - name: Check egw resolver identity
        run: ./scripts/check-egw-resolver-identity.sh

      - name: Check MoonBit registry bootstrap contract
        run: nu ./scripts/check-moon-registry-bootstrap.nu

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Check FFI export manifest (lambda app seam)
        run: node ./scripts/check-export-manifest.mjs

      - name: Test retry-wrapper regression
        run: ./scripts/test-moon-update-wrapper.sh

  changes:
    name: Change Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_prove: ${{ steps.filter.outputs.run_prove }}
      run_quint_sync: ${{ steps.filter.outputs.run_quint_sync }}
      run_e2e: ${{ steps.filter.outputs.run_e2e }}
      run_canvas_e2e: ${{ steps.filter.outputs.run_canvas_e2e }}
      run_cm6_adapter_e2e: ${{ steps.filter.outputs.run_cm6_adapter_e2e }}
      run_loomark_standalone_e2e: ${{ steps.filter.outputs.run_loomark_standalone_e2e }}
      run_tooling_validation: ${{ steps.filter.outputs.run_tooling_validation }}
      run_release_version_validation: ${{ steps.filter.outputs.run_release_version_validation }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            run_cm6_adapter_e2e:
              - 'adapters/editor/**'
              - '.github/actions/setup-moonbit/**'
              - 'scripts/moon-update.sh'
              - '.github/workflows/ci.yml'
            run_loomark_standalone_e2e:
              - 'apps/loomark/**'
              - 'deps/rabbita'
              - 'deps/rabbita/**'
              - '.github/actions/setup-moonbit/**'
              - '.github/workflows/ci.yml'
              - '.gitignore'
              - '.gitmodules'
              - 'scripts/install-local-warren.sh'
              - 'scripts/test-loomark-standalone-e2e.sh'
              - 'scripts/moon-update.sh'
            run_prove:
              - 'modules/semantic/proof/**'
              - '.github/actions/setup-moonbit/**'
              - 'scripts/moon-update.sh'
              - '.github/workflows/ci.yml'
            run_quint_sync:
              - 'examples/quint-sync-recovery/**'
              - 'modules/canopy/sync_session/**'
              - 'modules/canopy/protocol/wire/**'
              - 'deps/event-graph-walker'
              - 'deps/choreo'
              - 'deps/choreo/**'
              - '.gitmodules'
              - 'moon.work'
              - '.github/actions/setup-moonbit/**'
              - 'scripts/moon-update.sh'
              - '.github/workflows/ci.yml'
            run_e2e:
              - 'apps/web/**'
              - 'apps/ideal/**'
              - 'examples/demo-react/**'
              - 'modules/canvas-spatial/**'
              - '.github/actions/setup-moonbit/**'
              - 'scripts/moon-update.sh'
              - '.github/workflows/ci.yml'
              - 'scripts/build-js.sh'
              - 'scripts/test-ideal-web-e2e.sh'
              - 'scripts/test-demo-react-e2e.sh'
            run_canvas_e2e:
              - 'apps/canvas/**'
              - 'apps/web/vite-plugin-moonbit.ts'
              - 'modules/canvas-graph/**'
              - 'modules/skyline/**'
              - 'modules/canvas-layout/**'
              - 'modules/canvas-spatial/**'
              - '.github/actions/setup-moonbit/**'
              - 'scripts/moon-update.sh'
              - '.github/workflows/ci.yml'
              - 'scripts/build-js.sh'
              - 'scripts/link-canvas-artifacts.sh'
              - 'scripts/test-canvas-e2e.sh'
            run_tooling_validation:
              - 'justfile'
              - '.cursor/install.sh'
              - 'apps/web/scripts/build-deploy.sh'
              - 'apps/ideal/scripts/build-deploy.sh'
              - 'lefthook.yml'
              - '.githooks/pre-commit'
              - '.githooks/pre-push'
              - '.githooks/README.md'
              - '.claude/settings.json'
              - 'scripts/check-submodule-reachability.nu'
              - 'scripts/run-submodule-reachability.sh'
              - 'scripts/test-submodule-reachability.sh'
              - 'scripts/test-lefthook-pre-push-routing.sh'
              - 'scripts/local-validation.nu'
              - 'scripts/test-local-validation.sh'
              - 'scripts/install-hooks.nu'
              - 'scripts/install-hooks.sh'
              - 'scripts/test-install-hooks.sh'
              - 'scripts/test-lefthook-pre-commit-routing.sh'
              - 'scripts/check-moon-registry-bootstrap.nu'
              - 'scripts/check-moon-interfaces.nu'
              - 'scripts/validate-ci-yaml.sh'
              - 'scripts/moon-update.sh'
              - '.github/actions/setup-moonbit/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/benchmark.yml'
              - '.github/workflows/copilot-setup-steps.yml'
              - '.github/workflows/deploy-cloudflare.yml'
            run_release_version_validation:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'scripts/release-version-policy.nu'
              - 'scripts/generate-release-changelog.nu'
              - 'scripts/test-generate-release-changelog.nu'
              - 'scripts/test-release-workflow-wiring.mjs'
              - 'scripts/resolve-release-version.nu'
              - 'scripts/test-resolve-release-version.nu'
              - 'scripts/verify-release-target.nu'
              - 'scripts/test-verify-release-target.sh'

  tooling-validation:
    name: Just and Lefthook Configuration
    needs: changes
    if: needs.changes.outputs.run_tooling_validation == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install just
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: just@1.58.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Nushell
        uses: hustcer/setup-nu@f3fd65374ffc4d60974c0dd2f7263c6c5c285f81
        with:
          version: "0.114.1"

      - name: Validate justfile
        run: just --unstable --fmt --check

      - name: Validate GitHub Actions YAML
        run: ./scripts/validate-ci-yaml.sh

      - name: Validate just recipes
        run: |
          just --list
          just --dry-run check
          just --dry-run fmt-check
          just --dry-run pre-commit
          just --dry-run registry-refresh
          just --dry-run release-artifacts v0.2.0

      - name: Validate MoonBit registry bootstrap contract
        run: |
          nu --ide-check 100 scripts/check-moon-registry-bootstrap.nu
          nu scripts/check-moon-registry-bootstrap.nu

      - name: Validate Nushell scripts
        run: |
          nu --ide-check 100 scripts/check-submodule-reachability.nu
          nu --ide-check 100 scripts/install-hooks.nu
          nu --ide-check 100 scripts/local-validation.nu

      - name: Test Nushell installer
        run: bash scripts/test-install-hooks.sh

      - name: Test local validation lifecycle
        run: bash scripts/test-local-validation.sh

      - name: Validate Claude settings
        run: node -e 'JSON.parse(require("fs").readFileSync(".claude/settings.json", "utf8"))'

      - name: Validate compatibility entry points
        run: |
          bash -n .cursor/install.sh apps/web/scripts/build-deploy.sh apps/ideal/scripts/build-deploy.sh .githooks/pre-commit .githooks/pre-push scripts/run-submodule-reachability.sh scripts/test-local-validation.sh scripts/test-submodule-reachability.sh scripts/test-lefthook-pre-commit-routing.sh scripts/test-lefthook-pre-push-routing.sh scripts/install-hooks.sh
          grep -Fq 'exec just pre-commit' .githooks/pre-commit
          grep -Fq 'exec lefthook run pre-push' .githooks/pre-push
          grep -Fq 'exec just install-hooks' scripts/install-hooks.sh

      - name: Validate Lefthook configuration
        env:
          LEFTHOOK_VERSION: 2.1.10
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/lefthook_${LEFTHOOK_VERSION}_Linux_x86_64" \
            --output "${RUNNER_TEMP}/lefthook"
          printf '%s  %s\n' \
            'f1de34ea0572363a525a2000d40f5a646733893ad28c924b34ac98304518073f' \
            "${RUNNER_TEMP}/lefthook" | sha256sum --check --status
          chmod +x "${RUNNER_TEMP}/lefthook"
          "${RUNNER_TEMP}/lefthook" validate

      - name: Test path-aware Lefthook pre-commit routing
        run: LEFTHOOK_BIN="${RUNNER_TEMP}/lefthook" bash scripts/test-lefthook-pre-commit-routing.sh

      - name: Test narrow Lefthook pre-push submodule routing
        run: LEFTHOOK_BIN="${RUNNER_TEMP}/lefthook" bash scripts/test-lefthook-pre-push-routing.sh

      - name: Test shared submodule reachability checker
        run: bash scripts/test-submodule-reachability.sh

  release-version-validation:
    name: Release Contract Validation
    needs: changes
    if: needs.changes.outputs.run_release_version_validation == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nushell
        uses: hustcer/setup-nu@f3fd65374ffc4d60974c0dd2f7263c6c5c285f81
        with:
          version: "0.114.1"

      - name: Validate release script syntax
        run: |
          nu --ide-check 100 scripts/release-version-policy.nu
          nu --ide-check 100 scripts/generate-release-changelog.nu
          nu --ide-check 100 scripts/test-generate-release-changelog.nu
          nu --ide-check 100 scripts/resolve-release-version.nu
          nu --ide-check 100 scripts/test-resolve-release-version.nu
          nu --ide-check 100 scripts/verify-release-target.nu
          bash -n scripts/test-verify-release-target.sh

      - name: Check release workflow wiring
        run: |
          ./scripts/validate-ci-yaml.sh
          node scripts/test-release-workflow-wiring.mjs

      - name: Run release changelog regression tests
        run: scripts/test-generate-release-changelog.nu

      - name: Run resolver regression tests
        run: scripts/test-resolve-release-version.nu

      - name: Run release target regression tests
        run: scripts/test-verify-release-target.sh

  test-main:
    name: Test Main Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Verify MoonBit installation
        run: moon version --all

      - name: Check code
        run: |
          bash ./scripts/check-agent-doc-links.sh
          ./scripts/check-documentation-lifecycle.sh
          ./scripts/check-strict.sh


      - name: Run tests
        run: ./scripts/check-test-baseline.sh 7 moon test --release

      - name: Build
        run: moon build --release

  test-submodules:
    name: Test Submodules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: event-graph-walker
            path: deps/event-graph-walker
            mode: ci-lenient
          - name: loom
            path: deps/loom/loom
            mode: ci-lenient
          - name: svg-dsl
            path: deps/svg-dsl
            mode: ci-lenient
          - name: graphviz
            path: deps/graphviz
            mode: ci-lenient
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Verify MoonBit installation
        run: moon version --all

      - name: Check and test ${{ matrix.name }}
        run: ./scripts/check-test-baseline.sh 7 ./scripts/run-moon-module.sh "${{ matrix.mode }}" "${{ matrix.path }}"

  test-examples:
    name: Test MoonBit Examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: ideal
            path: apps/ideal
            mode: ci-lenient
          - name: block-editor
            path: apps/block-editor
            mode: ci-lenient
          - name: canvas
            path: apps/canvas
            mode: ci-lenient
          - name: codemirror_demo
            path: examples/codemirror
            mode: ci-lenient
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Verify MoonBit installation
        run: moon version --all

      - name: Check and test ${{ matrix.name }}
        run: ./scripts/check-test-baseline.sh 7 ./scripts/run-moon-module.sh "${{ matrix.mode }}" "${{ matrix.path }}"

  prove:
    name: Formal Verification
    needs: [changes]
    if: needs.changes.outputs.run_prove == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Cache opam switch
        id: opam-cache
        uses: actions/cache@v6
        with:
          path: ~/.opam
          key: opam-why3-1.7.2-z3-${{ runner.os }}-${{ runner.arch }}

      - name: Install opam
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq opam

      - name: Initialize opam and install Why3/Z3
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: |
          opam init --disable-sandboxing --yes
          eval $(opam env)
          opam install why3.1.7.2 z3 --yes

      - name: Configure Why3 provers
        run: |
          eval $(opam env)
          why3 config detect

      - name: Run moon prove
        working-directory: modules/semantic/proof
        run: |
          eval $(opam env)
          moon prove

  quint-sync-verification:
    name: Quint Sync Recovery Verification
    needs: [changes]
    if: needs.changes.outputs.run_quint_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: examples/quint-sync-recovery/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Quint toolchain
        working-directory: examples/quint-sync-recovery
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run SyncSession verification suite
        run: ./examples/quint-sync-recovery/run.sh

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Check formatting
        run: |
          bash ./scripts/check-agent-doc-links.sh
          ./scripts/check-documentation-lifecycle.sh
          NEW_MOON_MOD=0 moon fmt
          VENDORED='^(deps/(alga|event-graph-walker|graphviz|loom|order-tree|rabbita|svg-dsl)|rle)(/.*)?$'
          CHANGED=$(git diff --name-only)
          if [ -z "$CHANGED" ]; then
            echo "Format check passed (no changes)."
          elif echo "$CHANGED" | grep -qvE "$VENDORED"; then
            echo "Formatting errors in Canopy-owned files:" >&2
            echo "$CHANGED" | grep -vE "$VENDORED" >&2
            exit 1
          fi
          echo "Format check passed (vendored-only formatting changes accepted)."

  build-js:
    name: Build JavaScript Target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Build JavaScript artifacts
        run: ./scripts/build-js.sh

      - name: Upload JS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: moonbit-js-build
          path: |
            _build/js/release/build/dowdiness/canopy/ffi/lambda/lambda.js
            _build/js/release/build/dowdiness/canopy/ffi/lambda/lambda.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/lambda/moonbit.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/json/json.js
            _build/js/release/build/dowdiness/canopy/ffi/json/json.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/json/moonbit.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/markdown/markdown.js
            _build/js/release/build/dowdiness/canopy/ffi/markdown/markdown.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/markdown/moonbit.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/jsx/jsx.js
            _build/js/release/build/dowdiness/canopy/ffi/jsx/jsx.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/jsx/moonbit.d.ts
            _build/js/release/build/dowdiness/graphviz/browser/browser.js
            _build/js/release/build/dowdiness/graphviz/browser/browser.d.ts
            _build/js/release/build/dowdiness/ideal-editor/main/main.js
            _build/js/release/build/dowdiness/ideal-editor/main/main.d.ts
            _build/js/release/build/dowdiness/ideal-editor/main/moonbit.d.ts
            _build/js/release/build/dowdiness/canopy-canvas/main/main.js
            _build/js/release/build/dowdiness/canopy-canvas/main/main.d.ts
            _build/js/release/build/dowdiness/canopy-canvas/main/moonbit.d.ts
          retention-days: 7

  web-build:
    name: Build Web Example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            examples/prosemirror/package-lock.json

      - name: Build web
        run: ./scripts/build-web.sh

      - name: Type check web
        working-directory: apps/web
        run: npm run typecheck

      - name: Check web dependency boundaries
        working-directory: apps/web
        run: npm run check:boundaries

      - name: Test web dependency boundaries
        working-directory: apps/web
        run: npm run test:boundaries

      - name: Install prosemirror dependencies
        working-directory: examples/prosemirror
        run: npm ci

      - name: Type check prosemirror
        working-directory: examples/prosemirror
        run: npx tsc --noEmit

  waku-build:
    name: Build Waku Web Foundation
    needs: [build-js, changes]
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CANOPY_SKIP_MOON_BUILD: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download MoonBit JS artifacts
        uses: actions/download-artifact@v8
        with:
          name: moonbit-js-build
          path: _build/js/release/build/dowdiness

      - name: Verify all Waku MoonBit inputs
        run: |
          test -f _build/js/release/build/dowdiness/canopy/ffi/lambda/lambda.js
          test -f _build/js/release/build/dowdiness/canopy/ffi/json/json.js
          test -f _build/js/release/build/dowdiness/canopy/ffi/markdown/markdown.js
          test -f _build/js/release/build/dowdiness/canopy/ffi/jsx/jsx.js
          test -f _build/js/release/build/dowdiness/graphviz/browser/browser.js

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type check Waku sources
        working-directory: apps/web
        run: npm run typecheck

      - name: Check and test Waku boundaries
        working-directory: apps/web
        run: |
          npm run check:boundaries
          npm run test:boundaries
          npm run test:foundation

      - name: Build Waku from prebuilt MoonBit artifacts
        working-directory: apps/web
        run: npm run build:waku

      - name: Assert generated client/server bundle boundaries
        working-directory: apps/web
        run: npm run check:waku-bundles

      - name: Check generated Cloudflare binding types
        working-directory: apps/web
        run: npm run check:waku-types

      - name: Dry-run the preview Worker bundle
        working-directory: apps/web
        run: >-
          npx wrangler deploy --config wrangler.waku.jsonc --dry-run --env preview
          --outfile "${RUNNER_TEMP}/waku-preview-worker.bundle"

      - name: Record Worker startup profile
        working-directory: apps/web
        run: >-
          npx wrangler check startup
          --worker "${RUNNER_TEMP}/waku-preview-worker.bundle"

      - name: Dry-run the production Worker bundle
        working-directory: apps/web
        run: >-
          npx wrangler deploy --config wrangler.waku.jsonc --dry-run --env production
          --outfile "${RUNNER_TEMP}/waku-production-worker.bundle"

      - name: Record production Worker startup profile
        working-directory: apps/web
        run: >-
          npx wrangler check startup
          --worker "${RUNNER_TEMP}/waku-production-worker.bundle"

      - name: Create Waku release manifest
        working-directory: apps/web
        run: npm run create:waku-release-manifest -- "${RUNNER_TEMP}/waku-web-release-manifest.json"

      - name: Upload Waku Worker build
        uses: actions/upload-artifact@v7
        with:
          name: waku-web-build-${{ github.run_attempt }}
          path: apps/web/dist
          retention-days: 30

      - name: Upload Waku release manifest
        uses: actions/upload-artifact@v7
        with:
          name: waku-web-release-manifest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/waku-web-release-manifest.json
          if-no-files-found: error
          retention-days: 30

  waku-e2e:
    name: Waku Web Foundation E2E
    needs: [build-js, changes, waku-build]
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    env:
      CANOPY_SKIP_MOON_BUILD: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download MoonBit JS artifacts
        uses: actions/download-artifact@v8
        with:
          name: moonbit-js-build
          path: _build/js/release/build/dowdiness

      - name: Download Waku production build
        uses: actions/download-artifact@v8
        with:
          name: waku-web-build-${{ github.run_attempt }}
          path: apps/web/dist

      - name: Verify all Waku MoonBit inputs
        run: |
          test -f _build/js/release/build/dowdiness/canopy/ffi/lambda/lambda.js
          test -f _build/js/release/build/dowdiness/canopy/ffi/json/json.js
          test -f _build/js/release/build/dowdiness/canopy/ffi/markdown/markdown.js
          test -f _build/js/release/build/dowdiness/canopy/ffi/jsx/jsx.js
          test -f _build/js/release/build/dowdiness/graphviz/browser/browser.js

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Waku foundation browser probes
        working-directory: apps/web
        run: npm run test:waku:e2e

      - name: Run built Waku GenUI preview probes
        working-directory: apps/web
        env:
          CANOPY_SKIP_WAKU_BUILD: 1
        run: npm run test:waku:preview

