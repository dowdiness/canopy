name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dep-check:
    name: Dependency Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run check-deps
        run: ./scripts/check-deps.sh

      - name: Check shared-substrate version drift
        run: ./scripts/check-shared-substrate.sh

      - name: Check egw resolver identity
        run: ./scripts/check-egw-resolver-identity.sh

      - name: Check moon update is retry-wrapped
        run: ./scripts/check-moon-update-wrapped.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Check FFI export manifest (lambda app seam)
        run: node ./scripts/check-export-manifest.mjs

      - name: Test moon update retry wrapper
        run: ./scripts/test-moon-update-wrapper.sh

      - name: Test PR-ready validation contract
        run: ./scripts/test-pr-ready-validation.sh

  changes:
    name: Change Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_prove: ${{ steps.filter.outputs.run_prove }}
      run_e2e: ${{ steps.filter.outputs.run_e2e }}
      run_cm6_adapter_e2e: ${{ steps.filter.outputs.run_cm6_adapter_e2e }}
      run_loomark_dev_host_e2e: ${{ steps.filter.outputs.run_loomark_dev_host_e2e }}
      run_pr_ready_bash3: ${{ steps.filter.outputs.run_pr_ready_bash3 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            run_cm6_adapter_e2e:
              - 'adapters/editor-adapter/**'
              - '.github/workflows/ci.yml'
            run_loomark_dev_host_e2e:
              - 'loomark/**'
              - 'editor/markdown/**'
              - 'modules/dom-boundary/**'
              - 'modules/js-ffi/**'
              - 'rabbita/**'
              - '.github/workflows/ci.yml'
              - 'scripts/test-loomark-dev-host-e2e.sh'
            run_prove:
              - 'lib/semantic/proof/**'
              - '.github/actions/setup-moonbit/**'
              - '.github/workflows/ci.yml'
              - 'scripts/moon-update.sh'
            run_e2e:
              - 'examples/web/**'
              - 'examples/ideal/**'
              - 'examples/demo-react/**'
              - 'examples/canvas/**'
              - '.github/workflows/ci.yml'
              - 'scripts/build-js.sh'
              - 'scripts/test-*.sh'
            run_pr_ready_bash3:
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  pr-ready-bash3:
    name: PR-ready Bash 3.2 Contract
    needs: changes
    if: needs.changes.outputs.run_pr_ready_bash3 == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Test the system Bash 3.2 contract
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          if [ "${BASH_VERSINFO[0]}" -ne 3 ] || \
             [ "${BASH_VERSINFO[1]}" -ne 2 ]; then
            echo "error: expected /bin/bash 3.2, got ${BASH_VERSION}" >&2
            exit 1
          fi

          bash32_bin="${RUNNER_TEMP}/canopy-bash32-bin"
          mkdir -p "$bash32_bin"
          ln -s /bin/bash "$bash32_bin/bash"

          PATH="$bash32_bin:$PATH" \
            /bin/bash ./scripts/check-moon-update-wrapped.sh
          PATH="$bash32_bin:$PATH" \
            /bin/bash ./scripts/test-pr-ready-validation.sh
          PATH="$bash32_bin:$PATH" \
            /bin/bash ./scripts/test-pr-ready-bash32.sh

  test-main:
    name: Test Main Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Verify MoonBit installation
        run: moon version --all

      - name: Update dependencies
        run: ./scripts/update-moon-deps.sh

      - name: Check code
        run: |
          bash ./scripts/check-agent-doc-links.sh
          ./scripts/check-documentation-lifecycle.sh
          ./scripts/check-strict.sh


      - name: Check moon.pkg compatibility with pinned toolchain
        run: ./scripts/check-moonbit-pkg-compat.sh
      - name: Run tests
        run: ./scripts/check-test-baseline.sh 7 moon test --release

      - name: Build
        run: moon build --release

  test-submodules:
    name: Test Submodules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: event-graph-walker
            path: event-graph-walker
            mode: ci-lenient
          - name: loom
            path: loom/loom
            mode: ci-lenient
          - name: svg-dsl
            path: svg-dsl
            mode: ci-lenient
          - name: graphviz
            path: graphviz
            mode: ci-lenient
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Verify MoonBit installation
        run: moon version --all

      - name: Check and test ${{ matrix.name }}
        run: ./scripts/check-test-baseline.sh 7 ./scripts/run-moon-module.sh "${{ matrix.mode }}" "${{ matrix.path }}"

  test-examples:
    name: Test MoonBit Examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: ideal
            path: examples/ideal
            mode: ci-lenient
          - name: block-editor
            path: examples/block-editor
            mode: ci-lenient
          - name: canvas
            path: examples/canvas
            mode: ci-lenient
          - name: codemirror_demo
            path: examples/codemirror_demo
            mode: ci-lenient
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Verify MoonBit installation
        run: moon version --all

      - name: Check and test ${{ matrix.name }}
        run: ./scripts/check-test-baseline.sh 7 ./scripts/run-moon-module.sh "${{ matrix.mode }}" "${{ matrix.path }}"

  prove:
    name: Formal Verification
    needs: [changes]
    if: needs.changes.outputs.run_prove == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Cache opam switch
        id: opam-cache
        uses: actions/cache@v6
        with:
          path: ~/.opam
          key: opam-why3-1.7.2-z3-${{ runner.os }}-${{ runner.arch }}

      - name: Install opam
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq opam

      - name: Initialize opam and install Why3/Z3
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: |
          opam init --disable-sandboxing --yes
          eval $(opam env)
          opam install why3.1.7.2 z3 --yes

      - name: Configure Why3 provers
        run: |
          eval $(opam env)
          why3 config detect

      - name: Update MoonBit dependencies
        working-directory: lib/semantic/proof
        run: |
          "$GITHUB_WORKSPACE/scripts/moon-update.sh"

      - name: Run moon prove
        working-directory: lib/semantic/proof
        run: |
          eval $(opam env)
          moon prove

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Check formatting
        run: |
          bash ./scripts/check-agent-doc-links.sh
          ./scripts/check-documentation-lifecycle.sh
          NEW_MOON_MOD=0 moon fmt
          VENDORED='^(alga|event-graph-walker|graphviz|loom|order-tree|rabbita|rle|svg-dsl)(/.*)?$'
          CHANGED=$(git diff --name-only)
          if [ -z "$CHANGED" ]; then
            echo "Format check passed (no changes)."
          elif echo "$CHANGED" | grep -qvE "$VENDORED"; then
            echo "Formatting errors in Canopy-owned files:" >&2
            echo "$CHANGED" | grep -vE "$VENDORED" >&2
            exit 1
          fi
          echo "Format check passed (vendored-only formatting changes accepted)."

  build-js:
    name: Build JavaScript Target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Update dependencies
        run: ./scripts/update-moon-deps.sh

      - name: Build JavaScript artifacts
        run: ./scripts/build-js.sh

      - name: Check moon.pkg compatibility with pinned toolchain
        run: ./scripts/check-moonbit-pkg-compat.sh

      - name: Upload JS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: moonbit-js-build
          path: |
            _build/js/release/build/dowdiness/canopy/ffi/lambda/lambda.js
            _build/js/release/build/dowdiness/canopy/ffi/lambda/lambda.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/lambda/moonbit.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/json/json.js
            _build/js/release/build/dowdiness/canopy/ffi/json/json.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/json/moonbit.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/markdown/markdown.js
            _build/js/release/build/dowdiness/canopy/ffi/markdown/markdown.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/markdown/moonbit.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/jsx/jsx.js
            _build/js/release/build/dowdiness/canopy/ffi/jsx/jsx.d.ts
            _build/js/release/build/dowdiness/canopy/ffi/jsx/moonbit.d.ts
            _build/js/release/build/dowdiness/graphviz/browser/browser.js
            _build/js/release/build/dowdiness/graphviz/browser/browser.d.ts
            _build/js/release/build/dowdiness/ideal-editor/main/main.js
            _build/js/release/build/dowdiness/ideal-editor/main/main.d.ts
            _build/js/release/build/dowdiness/ideal-editor/main/moonbit.d.ts
            _build/js/release/build/dowdiness/canopy-canvas/main/main.js
            _build/js/release/build/dowdiness/canopy-canvas/main/main.d.ts
            _build/js/release/build/dowdiness/canopy-canvas/main/moonbit.d.ts
          retention-days: 7

  web-build:
    name: Build Web Example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            examples/web/package-lock.json
            examples/prosemirror/package-lock.json

      - name: Update MoonBit dependencies
        run: ./scripts/update-moon-deps.sh

      - name: Build web
        run: ./scripts/build-web.sh

      - name: Type check web
        working-directory: examples/web
        run: npm run typecheck

      - name: Check web dependency boundaries
        working-directory: examples/web
        run: npm run check:boundaries

      - name: Test web dependency boundaries
        working-directory: examples/web
        run: npm run test:boundaries

      - name: Install prosemirror dependencies
        working-directory: examples/prosemirror
        run: npm ci

      - name: Type check prosemirror
        working-directory: examples/prosemirror
        run: npx tsc --noEmit

  waku-build:
    name: Build Waku Web Foundation
    needs: [build-js, changes]
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CANOPY_SKIP_MOON_BUILD: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download MoonBit JS artifacts
        uses: actions/download-artifact@v8
        with:
          name: moonbit-js-build
          path: _build/js/release/build/dowdiness

      - name: Verify all Waku MoonBit inputs
        run: |
          test -f _build/js/release/build/dowdiness/canopy/ffi/lambda/lambda.js
          test -f _build/js/release/build/dowdiness/canopy/ffi/json/json.js
          test -f _build/js/release/build/dowdiness/canopy/ffi/markdown/markdown.js
          test -f _build/js/release/build/dowdiness/canopy/ffi/jsx/jsx.js
          test -f _build/js/release/build/dowdiness/graphviz/browser/browser.js

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: examples/web/package-lock.json

      - name: Install web dependencies
        working-directory: examples/web
        run: npm ci

      - name: Type check Waku sources
        working-directory: examples/web
        run: npm run typecheck

      - name: Check and test Waku boundaries
        working-directory: examples/web
        run: |
          npm run check:boundaries
          npm run test:boundaries
          npm run test:foundation

      - name: Build Waku from prebuilt MoonBit artifacts
        working-directory: examples/web
        run: npm run build:waku

      - name: Assert generated client/server bundle boundaries
        working-directory: examples/web
        run: npm run check:waku-bundles

      - name: Check generated Cloudflare binding types
        working-directory: examples/web
        run: npm run check:waku-types

      - name: Dry-run the preview Worker bundle
        working-directory: examples/web
        run: >-
          npx wrangler deploy --config wrangler.waku.jsonc --dry-run --env preview
          --outfile "${RUNNER_TEMP}/waku-preview-worker.bundle"

      - name: Record Worker startup profile
        working-directory: examples/web
        run: >-
          npx wrangler check startup
          --worker "${RUNNER_TEMP}/waku-preview-worker.bundle"

      - name: Dry-run the production Worker bundle
        working-directory: examples/web
        run: >-
          npx wrangler deploy --config wrangler.waku.jsonc --dry-run --env production
          --outfile "${RUNNER_TEMP}/waku-production-worker.bundle"

      - name: Record production Worker startup profile
        working-directory: examples/web
        run: >-
          npx wrangler check startup
          --worker "${RUNNER_TEMP}/waku-production-worker.bundle"

      - name: Create Waku release manifest
        working-directory: examples/web
        run: npm run create:waku-release-manifest -- "${RUNNER_TEMP}/waku-web-release-manifest.json"

      - name: Upload Waku Worker build
        uses: actions/upload-artifact@v7
        with:
          name: waku-web-build-${{ github.run_attempt }}
          path: examples/web/dist
          retention-days: 30

      - name: Upload Waku release manifest
        uses: actions/upload-artifact@v7
        with:
          name: waku-web-release-manifest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/waku-web-release-manifest.json
          if-no-files-found: error
          retention-days: 30

  waku-e2e:
    name: Waku Web Foundation E2E
    needs: [build-js, changes, waku-build]
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    env:
      CANOPY_SKIP_MOON_BUILD: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download MoonBit JS artifacts
        uses: actions/download-artifact@v8
        with:
          name: moonbit-js-build
          path: _build/js/release/build/dowdiness

      - name: Download Waku production build
        uses: actions/download-artifact@v8
        with:
          name: waku-web-build-${{ github.run_attempt }}
          path: examples/web/dist

      - name: Verify all Waku MoonBit inputs
        run: |
          test -f _build/js/release/build/dowdiness/canopy/ffi/lambda/lambda.js
          test -f _build/js/release/build/dowdiness/canopy/ffi/json/json.js
          test -f _build/js/release/build/dowdiness/canopy/ffi/markdown/markdown.js
          test -f _build/js/release/build/dowdiness/canopy/ffi/jsx/jsx.js
          test -f _build/js/release/build/dowdiness/graphviz/browser/browser.js

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: examples/web/package-lock.json

      - name: Install web dependencies
        working-directory: examples/web
        run: npm ci

      - name: Run Waku foundation browser probes
        working-directory: examples/web
        run: npm run test:waku:e2e

      - name: Run built Waku GenUI preview probes
        working-directory: examples/web
        env:
          CANOPY_SKIP_WAKU_BUILD: 1
        run: npm run test:waku:preview

  waku-workerd:
    name: Waku Worker Foundation Smoke
    needs: [waku-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: examples/web/package-lock.json

      - name: Install web dependencies
        working-directory: examples/web
        run: npm ci

      - name: Download Waku Worker build
        uses: actions/download-artifact@v8
        with:
          name: waku-web-build-${{ github.run_attempt }}
          path: examples/web/dist

      - name: Smoke built Worker under workerd
        working-directory: examples/web
        run: npm run test:waku:workerd

  ideal-web-e2e:
    name: Ideal Web E2E
    needs: [build-js, changes]
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      CANOPY_SKIP_MOON_BUILD: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download MoonBit JS artifacts
        uses: actions/download-artifact@v8
        with:
          name: moonbit-js-build
          path: _build/js/release/build/dowdiness

      - name: Verify downloaded artifacts
        run: |
          test -f _build/js/release/build/dowdiness/ideal-editor/main/main.js
          echo "All required MoonBit JS artifacts verified"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: examples/ideal/web/package-lock.json

      - name: Install web dependencies
        working-directory: examples/ideal/web
        run: npm ci

      - name: Run Ideal editor Playwright suite
        run: ./scripts/test-ideal-web-e2e.sh

  demo-react-e2e:
    name: Demo React E2E
    needs: [build-js, changes]
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host
    env:
      CANOPY_SKIP_MOON_BUILD: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download MoonBit JS artifacts
        uses: actions/download-artifact@v8
        with:
          name: moonbit-js-build
          path: _build/js/release/build/dowdiness

      - name: Verify downloaded artifacts
        run: |
          test -f _build/js/release/build/dowdiness/canopy/ffi/lambda/lambda.js
          echo "All required MoonBit JS artifacts verified"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: examples/demo-react/package-lock.json

      - name: Install demo-react dependencies
        working-directory: examples/demo-react
        run: npm ci

      - name: Run demo-react Playwright suite
        run: ./scripts/test-demo-react-e2e.sh

  canvas-e2e:
    name: Canvas E2E
    needs: [build-js, changes]
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    env:
      CANOPY_SKIP_MOON_BUILD: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download MoonBit JS artifacts
        uses: actions/download-artifact@v8
        with:
          name: moonbit-js-build
          path: _build/js/release/build/dowdiness

      - name: Verify downloaded artifacts
        run: |
          test -f _build/js/release/build/dowdiness/canopy-canvas/main/main.js
          echo "All required MoonBit JS artifacts verified"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: examples/canvas/web/package-lock.json

      - name: Install canvas web dependencies
        working-directory: examples/canvas/web
        run: npm ci

      - name: Run canvas Playwright suite
        run: ./scripts/test-canvas-e2e.sh

  cm6-adapter-e2e:
    name: CM6 Adapter E2E
    needs: [build-js, changes]
    if: needs.changes.outputs.run_cm6_adapter_e2e == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download MoonBit JS artifacts
        uses: actions/download-artifact@v8
        with:
          name: moonbit-js-build
          path: _build/js/release/build/dowdiness

      - name: Verify Lambda diagnostic-fix runtime
        run: test -f _build/js/release/build/dowdiness/canopy/ffi/lambda/lambda.js

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: adapters/editor-adapter/package-lock.json

      - name: Install editor adapter dependencies
        working-directory: adapters/editor-adapter
        run: npm ci

      - name: Type check CM6 adapter and harness
        working-directory: adapters/editor-adapter
        run: npm run typecheck:cm6

      - name: Run CM6 adapter Playwright suite
        working-directory: adapters/editor-adapter
        run: npm run test:e2e:cm6

  loomark-dev-host-e2e:
    name: Loomark Dev Host E2E
    needs: [changes]
    if: needs.changes.outputs.run_loomark_dev_host_e2e == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Verify MoonBit installation
        run: moon version --all

      - name: Update MoonBit dependencies
        run: ./scripts/update-moon-deps.sh

      - name: Run Loomark dev-host browser suite
        run: ./scripts/test-loomark-dev-host-e2e.sh

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - dep-check
      - changes
      - pr-ready-bash3
      - test-main
      - test-submodules
      - test-examples
      - prove
      - format-check
      - build-js
      - web-build
      - waku-build
      - waku-e2e
      - waku-workerd
      - ideal-web-e2e
      - demo-react-e2e
      - canvas-e2e
      - cm6-adapter-e2e
      - loomark-dev-host-e2e
    if: always()
    steps:
      - name: Check all job statuses
        run: |
          ok() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          path_filtered_ok() {
            [[ "$1" == "success" ]] ||
              [[ "$1" == "skipped" && "$2" == "false" ]]
          }
          if ! ok "${{ needs.dep-check.result }}" || \
             ! ok "${{ needs.changes.result }}" || \
             ! path_filtered_ok \
               "${{ needs.pr-ready-bash3.result }}" \
               "${{ needs.changes.outputs.run_pr_ready_bash3 }}" || \
             ! ok "${{ needs.test-main.result }}" || \
             ! ok "${{ needs.test-submodules.result }}" || \
             ! ok "${{ needs.test-examples.result }}" || \
             ! ok "${{ needs.prove.result }}" || \
             ! ok "${{ needs.format-check.result }}" || \
             ! ok "${{ needs.build-js.result }}" || \
             ! ok "${{ needs.web-build.result }}" || \
             ! ok "${{ needs.waku-build.result }}" || \
             ! ok "${{ needs.waku-e2e.result }}" || \
             ! ok "${{ needs.waku-workerd.result }}" || \
             ! ok "${{ needs.ideal-web-e2e.result }}" || \
             ! ok "${{ needs.demo-react-e2e.result }}" || \
             ! ok "${{ needs.canvas-e2e.result }}" || \
             ! ok "${{ needs.cm6-adapter-e2e.result }}" || \
             ! path_filtered_ok \
               "${{ needs.loomark-dev-host-e2e.result }}" \
               "${{ needs.changes.outputs.run_loomark_dev_host_e2e }}"; then
            echo "❌ One or more required checks failed"
            exit 1
          fi
          echo "✅ All checks passed!"
