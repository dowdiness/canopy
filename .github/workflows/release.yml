name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.2.0)'
        required: true
        type: string

concurrency:
  group: canopy-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: just@1.58.0

      - name: Install Nushell
        uses: hustcer/setup-nu@f3fd65374ffc4d60974c0dd2f7263c6c5c285f81
        with:
          version: "0.114.1"

      - name: Resolve release version
        id: resolve-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(nu scripts/resolve-release-version.nu \
            "$EVENT_NAME" "$REF_TYPE" "$REF_NAME" "$INPUT_VERSION")"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release target before build
        env:
          VERSION: ${{ steps.resolve-version.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: nu scripts/verify-release-target.nu "$VERSION" "$SOURCE_SHA" origin

      - name: Set up MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Update dependencies
        run: just update

      - name: Run tests
        run: just test-all

      - name: Build supported targets
        run: |
          just build
          just build-js

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build web application
        run: just build-web

      - name: Create release archive
        env:
          VERSION: ${{ steps.resolve-version.outputs.version }}
        run: just release-artifacts "$VERSION"

      - name: Generate changelog
        env:
          VERSION: ${{ steps.resolve-version.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          OUTPUT_PATH: CHANGELOG.txt
        run: nu scripts/generate-release-changelog.nu "$VERSION" "$SOURCE_SHA" "$REPOSITORY" "$OUTPUT_PATH"

      - name: Verify release target before publish
        env:
          VERSION: ${{ steps.resolve-version.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: nu scripts/verify-release-target.nu "$VERSION" "$SOURCE_SHA" origin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.resolve-version.outputs.version }}
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false
          files: |
            release/*.tar.gz

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release/
          retention-days: 90
