min_version: 2.1.0
assert_lefthook_installed: true
glob_matcher: doublestar

pre-commit:
  parallel: false
  fail_on_changes: always
  jobs:
    - name: moonbit-prepare
      run: just hook-moonbit-prepare

pre-push:
  parallel: false
  jobs:
    - name: repository-contract
      # A stable file template keeps branch-deletion and empty-commit pushes
      # from being skipped when Lefthook has no {push_files}.
      files: printf 'lefthook.yml\n'
      run: just hook-repository-contract {files}

    - name: documentation
      glob:
        - "AGENTS.md"
        - "CLAUDE.md"
        - "docs/**"
      run: just hook-documentation-contract

    - name: web
      glob:
        - "apps/web/**/*.js"
        - "apps/web/**/*.mjs"
        - "apps/web/**/*.ts"
        - "apps/web/**/*.tsx"
        - "apps/web/*.json"
      run: just hook-web-contract

    - name: tooling
      glob:
        - "lefthook.yml"
        - "justfile"
        - ".githooks/**"
        - ".claude/settings.json"
        - "scripts/**"
        - ".github/workflows/ci.yml"
      run: just hook-tooling-contract

    - name: submodule-reachability
      # Lefthook 2.1.10 filters gitlinks out of {push_files} as directories.
      # The all-files sentinel keeps this run job executable; the adapter
      # ignores those arguments and uses Git's ref-update stream instead.
      use_stdin: true
      run: ./scripts/run-submodule-reachability.sh {all_files}

    - name: moonbit-validate
      # See repository-contract: validation must run even with no push files.
      files: printf 'lefthook.yml\n'
      run: just hook-moonbit-validate {files}
